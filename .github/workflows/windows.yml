# Builds and tests TV Thing for Windows on Windows: typecheck, unit tests, the packaged zip, and an
# end-to-end FFmpeg conversion with the extension limited to the manifest's permissions.
# A pushed v* tag, or a manual run with "release" ticked, also creates a GitHub release with the
# zip, with notes from release-notes/v<version>.md.
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release the version in app/package.json (tags it v<version> on this commit)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, test, build and zip
        run: npm run package
      - name: End-to-end conversion with FFmpeg
        run: npm run smoke
      - name: Name the zip after the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item dist/TVThing-Windows.zip "dist/TVThing-Windows-$version.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
      # GitHub zips artifacts itself, so upload the app's files rather than the zip: the artifact
      # download is then the installable zip, not a zip inside a zip.
      - uses: actions/upload-artifact@v6
        with:
          name: TVThing-Windows-${{ steps.version.outputs.version }}
          path: app/dist/app/
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          if ($tag -ne "v$version") { throw "Tag $tag doesn't match version $version in app/package.json" }
          $zip = Get-Item "dist/TVThing-Windows-$version.zip"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            # Notes come from release-notes/<tag>.md, or else the annotated tag's message.
            $notes = "../release-notes/$tag.md"
            if (Test-Path $notes) { gh release create $tag --target $env:GITHUB_SHA --title "TV Thing for Windows $tag" --notes-file $notes }
            else { gh release create $tag --target $env:GITHUB_SHA --title "TV Thing for Windows $tag" --notes-from-tag }
            if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed' }
          }
          gh release upload $tag $zip.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the zip failed' }
