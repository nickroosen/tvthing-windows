# Builds and tests TV Thing for Windows on Windows: typecheck, unit tests, the packaged zip, and an
# end-to-end FFmpeg conversion with the extension limited to the manifest's permissions.
# A pushed v* tag also creates a GitHub release (notes from the annotated tag) with the zip.
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, test, build and zip
        run: npm run package
      - name: End-to-end conversion with FFmpeg
        run: npm run smoke
      - name: Name the zip after the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item dist/TVThing-Windows.zip "dist/TVThing-Windows-$version.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
      # GitHub zips artifacts itself, so upload the app's files rather than the zip: the artifact
      # download is then the installable zip, not a zip inside a zip.
      - uses: actions/upload-artifact@v6
        with:
          name: TVThing-Windows-${{ steps.version.outputs.version }}
          path: app/dist/app/
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-Item dist/TVThing-Windows-*.zip
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "TV Thing for Windows $env:GITHUB_REF_NAME" --notes-from-tag }
          gh release upload $env:GITHUB_REF_NAME $zip.FullName --clobber
